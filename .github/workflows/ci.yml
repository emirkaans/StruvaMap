name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # api'de önceden var olan tip hataları lint'i kırıyor; build+test asıl
      # kapıdır, lint şimdilik sadece bilgilendirici (bkz. #7 takip görevi).
      - name: Lint
        continue-on-error: true
        run: pnpm -r --if-present run lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon
